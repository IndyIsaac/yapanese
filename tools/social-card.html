<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>social card</title>
<link rel="stylesheet" href="../src/renderer/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #0d0d11;
    color: #f2f2f5;
    position: relative;
    display: grid;
    grid-template-columns: 1fr 430px;
    align-items: center;
    gap: 30px;
    padding: 0 80px;
  }

  /* Accent glow, anchored where the overlay would sit on screen. */
  body::before {
    content: '';
    position: absolute;
    width: 900px; height: 900px;
    right: -260px; top: -180px;
    background: radial-gradient(circle, rgba(232,66,47,.26), transparent 60%);
    pointer-events: none;
  }
  body::after {
    content: '';
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(circle at 28% 50%, black, transparent 78%);
    pointer-events: none;
  }

  .left { position: relative; z-index: 2; }

  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 30px; }
  .brand img { width: 72px; height: 72px; border-radius: 17px; }
  .brand h1 { font-size: 54px; font-weight: 600; letter-spacing: -.03em; }

  .tag {
    font-size: 38px; font-weight: 500; line-height: 1.22;
    letter-spacing: -.018em; margin-bottom: 18px; max-width: 15ch;
  }
  .tag em { font-style: normal; color: #9384f5; }

  .sub {
    font-size: 19px; line-height: 1.6; color: #9a9aa8;
    max-width: 40ch; margin-bottom: 38px;
  }

  .facts { display: flex; gap: 10px; }
  .fact {
    font-size: 14px; font-weight: 500;
    padding: 8px 15px; border-radius: 999px;
    border: 1px solid #2a2a35; background: #16161d; color: #b6b6c4;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .fact b { color: #f2f2f5; font-weight: 600; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; }

  /* Right: the overlay, at the moment it confirms a paste. */
  .stage { position: relative; z-index: 2; display: grid; gap: 22px; justify-items: stretch; }

  .pill {
    display: flex; align-items: center; gap: 14px;
    padding: 17px 26px; border-radius: 999px;
    background: rgba(23,23,29,.96);
    border: 1px solid rgba(255,255,255,.10);
    box-shadow: 0 26px 60px -14px rgba(0,0,0,.85), 0 0 0 1px rgba(232,66,47,.12);
    white-space: nowrap;
  }
  .lamp { width: 11px; height: 11px; border-radius: 50%; flex: 0 0 auto; }
  .pill.rec .lamp { background: #f0616d; box-shadow: 0 0 0 7px rgba(240,97,109,.16); }
  .pill.ok  .lamp { background: #4ade80; }
  .meter { display: flex; align-items: center; gap: 3px; height: 26px; }
  .meter i { width: 4px; border-radius: 2px; background: #e8422f; display: block; }
  .time { font-size: 16px; margin-left: auto; font-variant-numeric: tabular-nums; color: #f2f2f5; }
  .msg  { font-size: 16px; color: #a7e8bd; }

  .keys { display: flex; align-items: center; gap: 9px; justify-content: center; }
  kbd {
    font-family: inherit; font-size: 14px; font-weight: 500;
    background: #1c1c24; border: 1px solid #30303c; border-bottom-width: 3px;
    border-radius: 8px; padding: 8px 14px; color: #d7dade;
  }
  .plus { color: #6c6c7d; font-size: 14px; }
  .caption { font-size: 14px; color: #6c6c7d; text-align: center; }
</style>
</head>
<body>
  <div class="left">
    <div class="brand">
      <img src="../assets/icon.png" alt="">
      <h1>Yapanese</h1>
    </div>

    <div class="tag">Local dictation for <em>Windows</em>.</div>

    <div class="sub">
      Hold a key, talk, and the text lands where your cursor is.
      No account, no cloud, no per-minute billing.
    </div>

    <div class="facts">
      <span class="fact"><span class="dot"></span> Fully offline</span>
      <span class="fact"><b>0.8s</b> transcription</span>
      <span class="fact">MIT</span>
    </div>
  </div>

  <div class="stage">
    <div class="keys">
      <kbd>Ctrl</kbd><span class="plus">+</span><kbd>Win</kbd>
    </div>

    <div class="pill rec">
      <span class="lamp"></span>
      <span class="meter">
        <i style="height:6px"></i><i style="height:13px"></i><i style="height:21px"></i><i style="height:11px"></i>
        <i style="height:24px"></i><i style="height:16px"></i><i style="height:9px"></i><i style="height:19px"></i>
        <i style="height:26px"></i><i style="height:12px"></i><i style="height:7px"></i><i style="height:17px"></i>
        <i style="height:22px"></i><i style="height:10px"></i>
      </span>
      <span class="time">0:04</span>
    </div>

    <div class="pill ok">
      <span class="lamp"></span>
      <span class="msg">Pasted &middot; 24 words</span>
    </div>

    <div class="caption">hold &middot; double tap to lock &middot; tap to stop</div>
  </div>
</body>
</html>
