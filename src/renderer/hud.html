<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self'">
<title>Yapanese</title>
<link rel="stylesheet" href="./fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    display: grid;
    place-items: center;
    -webkit-user-select: none;
    cursor: default;
  }

  /* The window is wrapped around this by the main process, which measures
     what is drawn here. Room is left for the shadow, which would otherwise
     be clipped by the window edge. */
  #wrap { padding: 8px 10px; display: inline-flex; }

  .pill {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 6px 12px;
    border-radius: 999px;
    box-sizing: border-box;
    background: rgba(19, 19, 21, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.09);
    backdrop-filter: blur(18px) saturate(1.3);
    box-shadow: 0 10px 26px -8px rgba(0, 0, 0, 0.75), 0 1px 4px rgba(0, 0, 0, 0.45);
    color: #f4f4f5;
    cursor: grab;
    transform: translateY(6px) scale(0.98);
    opacity: 0;
    transition: transform 220ms cubic-bezier(.22,1,.36,1), opacity 170ms ease-out;
  }
  .pill.in { transform: none; opacity: 1; }
  .pill.dragging { cursor: grabbing; transition: none; }

  /* Idle is a marker, not a status bar: small enough to leave on screen all
     day, and it says the app is listening for the shortcut. */
  .pill[data-state='idle'] { padding: 5px 10px; opacity: 0.45; }
  .pill[data-state='idle'].in { opacity: 0.45; }
  .pill[data-state='idle']:hover.in { opacity: 1; }
  .pill[data-state='idle'] .meter,
  .pill[data-state='idle'] .time { display: none; }

  /* Unfinished setup is not a resting state — the app cannot do its job —
     so it does not get to fade into the background like an idle one. */
  .pill[data-ready='false'][data-state='idle'],
  .pill[data-ready='false'][data-state='idle'].in { opacity: 1; }
  .pill[data-ready='false'][data-state='idle'] .lamp { background: #f2b544; }
  .pill[data-ready='false'][data-state='idle'] .msg { color: #f2b544; }

  /* state lamp */
  .lamp { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; background: #82828c; }
  .pill[data-state='recording'] .lamp {
    background: #e8422f;
    box-shadow: 0 0 0 0 rgba(232, 66, 47, 0.55);
    animation: ping 1.8s cubic-bezier(.22,1,.36,1) infinite;
  }
  @keyframes ping {
    0%   { box-shadow: 0 0 0 0 rgba(232,66,47,.5); }
    70%  { box-shadow: 0 0 0 8px rgba(232,66,47,0); }
    100% { box-shadow: 0 0 0 0 rgba(232,66,47,0); }
  }
  .pill[data-state='done'] .lamp { background: #4ade80; }
  .pill[data-state='error'] .lamp { background: #e8422f; }

  /* Locked recording gets a steady ring instead of the pulse, so a glance
     tells you whether it stops when you let go or keeps running. */
  .pill[data-locked='true'] .lamp {
    animation: none;
    box-shadow: 0 0 0 3px rgba(232, 66, 47, 0.30);
  }
  .pill[data-locked='true'] { border-color: rgba(232, 66, 47, 0.45); }

  /* the meter is the signature: real levels, not a decorative loop */
  .meter { display: flex; align-items: center; gap: 2.5px; height: 16px; flex: 0 0 auto; }
  .meter i {
    display: block;
    width: 2.5px;
    min-height: 2.5px;
    border-radius: 2px;
    background: #e8422f;
    transform-origin: center;
    transition: height 70ms linear, opacity 200ms ease;
  }
  /* Transcribing has no live signal to show, but going still reads as
     "nothing is happening". The bars run as a travelling wave instead, so
     there is always visible evidence that the app is still working. */
  .pill[data-state='transcribing'] .meter i {
    background: #e8422f;
    transition: none;
    animation: work 1.15s ease-in-out infinite;
    animation-delay: calc(var(--i, 0) * 45ms);
  }
  @keyframes work {
    0%, 100% { transform: scaleY(1); opacity: 0.3; }
    45%      { transform: scaleY(4.2); opacity: 1; }
  }

  .label { font-size: 11.5px; color: #b4b4bb; white-space: nowrap; }
  .time {
    font-size: 11.5px; color: #f4f4f5;
    font-variant-numeric: tabular-nums;
    min-width: 30px; text-align: right;
    flex: 0 0 auto;
  }

  /* The bars themselves carry the transcribing animation now. A gradient
     sweeping over them as well read as a solid block sitting on the meter. */
  .sweep { position: relative; overflow: hidden; }

  .msg {
    font-size: 11.5px;
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #b4b4bb;
    flex: 0 1 auto;
  }
  .pill[data-state='error'] .msg { color: #ff8b7a; }
  .pill[data-state='done'] .msg { color: #a7e8bd; }

  /* A result the user still has to act on — it was copied, not pasted —
     carries the transcript itself so they can see it was heard correctly
     without opening anything. */
  .snippet {
    font-size: 11.5px;
    color: #82828c;
    max-width: 190px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    border-left: 1px solid rgba(255,255,255,0.12);
    padding-left: 9px;
    flex: 0 1 auto;
  }

  /* Once recording stops there is no live signal to show, and leaving the
     meter in place pushed the result message past the window edge. */
  .pill[data-state='done'] .meter,
  .pill[data-state='error'] .meter { display: none; }
</style>
</head>
<body>
  <div id="wrap">
    <div class="pill" id="pill" data-state="idle">
      <span class="lamp"></span>
      <span class="meter sweep" id="meter"></span>
      <span class="msg" id="msg" hidden></span>
      <span class="snippet" id="snippet" hidden></span>
      <span class="time" id="time">0:00</span>
    </div>
  </div>
  <script src="./hud.js"></script>
</body>
</html>
