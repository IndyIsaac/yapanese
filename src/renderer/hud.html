<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self'">
<title>Yapanese</title>
<link rel="stylesheet" href="./fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    display: grid;
    place-items: center;
    -webkit-user-select: none;
    cursor: default;
  }

  /* The window is a fixed 164x42 and this fills it, so the pill lands in the
     middle with room around it for the shadow. Nothing here is measured and
     nothing asks the window to resize: the pill is the same shape whatever it
     is doing, which is the point — starting a recording should bring the
     indicator to life, not replace it with something twice the size. */
  #wrap { width: 100%; height: 100%; display: grid; place-items: center; }

  .pill {
    width: 144px;
    height: 26px;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 0 11px;
    border-radius: 999px;
    background: rgba(19, 19, 21, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.09);
    backdrop-filter: blur(18px) saturate(1.3);
    box-shadow: 0 10px 26px -8px rgba(0, 0, 0, 0.75), 0 1px 4px rgba(0, 0, 0, 0.45);
    color: #f4f4f5;
    cursor: grab;
    transform: translateY(6px) scale(0.98);
    opacity: 0;
    transition: transform 220ms cubic-bezier(.22,1,.36,1), opacity 170ms ease-out;
  }
  .pill.in { transform: none; opacity: 1; }
  .pill.dragging { cursor: grabbing; transition: none; }

  /* Resting, it is a marker rather than a status bar — quiet enough to leave
     on screen all day, and it says nothing, because a word that reads "Ready"
     all day is just noise. The dot and the waveform are the whole message.

     The chrome recedes, not the pill. Fading the whole element with `opacity`
     takes the green dot down with it, and a status light you have to squint at
     is not doing its job — a child cannot be more opaque than its parent. So
     the background, the border and the shadow are dialled back individually
     and the dot is left alone. */
  .pill[data-state='idle'] {
    background: rgba(19, 19, 21, 0.52);
    border-color: rgba(255, 255, 255, 0.05);
    box-shadow: 0 6px 16px -8px rgba(0, 0, 0, 0.55);
    transition: transform 220ms cubic-bezier(.22,1,.36,1), opacity 170ms ease-out,
                background 200ms ease, box-shadow 200ms ease, border-color 200ms ease;
  }
  .pill[data-state='idle']:hover.in,
  .pill[data-ready='false'][data-state='idle'] {
    background: rgba(19, 19, 21, 0.92);
    border-color: rgba(255, 255, 255, 0.09);
    box-shadow: 0 10px 26px -8px rgba(0, 0, 0, 0.75), 0 1px 4px rgba(0, 0, 0, 0.45);
  }

  /* Unfinished setup is not a resting state — the app cannot do its job — so
     it does not get to recede like an idle one. */
  .pill[data-ready='false'][data-state='idle'] .lamp {
    background: #f2b544;
    animation: breathe 2.4s ease-in-out infinite;
  }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  /* ------------------------------------------------------------ the lamp */
  .lamp {
    width: 8px; height: 8px; border-radius: 50%;
    flex: 0 0 auto;
    background: #6b6b74;
    transition: background 160ms ease;
  }
  /* Green at rest: the app is up and listening for the shortcut. It shares a
     colour with a finished transcription, which cannot be confused with it —
     that one arrives with words beside it and at full opacity. */
  .pill[data-state='idle'] .lamp { background: #4ade80; }
  .pill[data-state='recording'] .lamp {
    background: #e8422f;
    box-shadow: 0 0 0 0 rgba(232, 66, 47, 0.55);
    animation: ping 1.8s cubic-bezier(.22,1,.36,1) infinite;
  }
  @keyframes ping {
    0%   { box-shadow: 0 0 0 0 rgba(232,66,47,.5); }
    70%  { box-shadow: 0 0 0 7px rgba(232,66,47,0); }
    100% { box-shadow: 0 0 0 0 rgba(232,66,47,0); }
  }
  .pill[data-state='transcribing'] .lamp { background: #f2b544; }
  .pill[data-state='done'] .lamp { background: #4ade80; }
  .pill[data-state='error'] .lamp { background: #e8422f; }

  /* Locked recording gets a steady ring instead of the pulse, so a glance
     tells you whether it stops when you let go or keeps running. */
  .pill[data-locked='true'] .lamp {
    animation: none;
    box-shadow: 0 0 0 3px rgba(232, 66, 47, 0.30);
  }
  .pill[data-locked='true'] { border-color: rgba(232, 66, 47, 0.45); }

  /* ------------------------------------------------------------ the body */
  /* One slot, shared. The meter lives here while there is audio to show and
     a message takes its place when there is something to say, so neither can
     push the other along and change the width. */
  .body { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; }

  .meter { display: flex; align-items: center; gap: 2px; height: 14px; flex: 0 0 auto; }
  .meter i {
    display: block;
    width: 2px;
    min-height: 2px;
    border-radius: 1px;
    background: #e8422f;
    transform-origin: center;
    transition: height 70ms linear, opacity 200ms ease;
  }
  /* At rest the bars hold a still waveform — the whole of what the pill says
     when it is idle, in place of the word it used to carry.

     !important because the live levels are written as inline styles while
     recording and are still on the elements afterwards; without it, going
     back to idle left the shape wearing the last thing that was said. */
  .pill[data-state='idle'] .meter i {
    background: #9aa0a6;
    opacity: 0.62 !important;
    height: var(--idle-h, 2px) !important;
    transition: none;
  }
  .pill[data-state='idle']:hover .meter i { opacity: 0.85 !important; }
  /* Transcribing has no live signal to show, but going still reads as
     "nothing is happening". The bars run as a travelling wave instead. */
  .pill[data-state='transcribing'] .meter i {
    background: #f2b544;
    transition: none;
    animation: work 1.15s ease-in-out infinite;
    animation-delay: calc(var(--i, 0) * 40ms);
  }
  @keyframes work {
    0%, 100% { transform: scaleY(1); opacity: 0.3; }
    45%      { transform: scaleY(3.6); opacity: 1; }
  }

  .msg {
    font-size: 10.5px;
    line-height: 1;
    letter-spacing: 0.01em;
    width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #b4b4bb;
  }
  .pill[data-state='error'] .msg { color: #ff8b7a; }
  .pill[data-state='done'] .msg { color: #a7e8bd; }

  /* A message and a meter never occupy the slot at the same time. */
  .msg[hidden] { display: none; }
  .body:has(.msg:not([hidden])) .meter { display: none; }

  /* ------------------------------------------------------------ the clock */
  .time {
    font-size: 10.5px;
    line-height: 1;
    color: #f4f4f5;
    font-variant-numeric: tabular-nums;
    min-width: 30px;
    text-align: right;
    flex: 0 0 auto;
  }
  /* Hidden rather than removed while idle, so the meter sits in exactly the
     position it will occupy once recording starts and nothing shifts under
     the eye at the moment the user begins talking. */
  .pill[data-state='idle'] .time { visibility: hidden; }
  /* Removed outright once there is a message, which then gets the full width
     — the pill is the same size either way, only its insides differ. */
  .pill[data-state='done'] .time,
  .pill[data-state='error'] .time { display: none; }
</style>
</head>
<body>
  <div id="wrap">
    <div class="pill" id="pill" data-state="idle">
      <span class="lamp"></span>
      <span class="body">
        <span class="meter" id="meter"></span>
        <span class="msg" id="msg" hidden></span>
      </span>
      <span class="time" id="time">0:00</span>
    </div>
  </div>
  <script src="./hud.js"></script>
</body>
</html>
